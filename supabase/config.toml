# Advent Your Year — Supabase settings pushed with `npx supabase config push`.
# Only auth settings are declared here; everything else on the project is left as-is.
# Secrets come from environment variables at push time (see tools/supabase-setup.mjs); none are stored here.
project_id = "adventyouryear"

[auth]
enabled = true
site_url = "https://josephjackman.com/adventyouryear/"
additional_redirect_urls = ["https://josephjackman.com/adventyouryear/", "http://localhost:5173/docs/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 60
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "30s"
otp_length = 6
otp_expiry = 3600

# Same Resend account and sender as Roleplay20.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(EMAIL_FROM_ADDRESS)"
sender_name = "Advent Your Year"

[auth.email.template.confirmation]
subject = "Your Advent Your Year code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Advent Your Year password"
content_path = "./supabase/templates/recovery.html"
